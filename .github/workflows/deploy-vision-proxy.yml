name: Deploy vision proxy

on:
  push:
    branches: [main]
    paths:
      - "backend/vision_proxy/**"
      - ".github/workflows/deploy-vision-proxy.yml"
  workflow_dispatch: {}

# id-token: write is required to mint the OIDC token this workflow exchanges for AWS
# credentials -- see backend/vision_proxy/README.md's "CI deploy setup" section for the
# one-time IAM role this trusts.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the deployment package
        working-directory: backend/vision_proxy
        run: |
          pip install -r requirements.txt -t package
          cp lambda_function.py package/

      - name: Zip the deployment package
        working-directory: backend/vision_proxy/package
        run: zip -r ../function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.VISION_PROXY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.VISION_PROXY_AWS_REGION }}

      - name: Deploy to Lambda
        working-directory: backend/vision_proxy
        run: |
          aws lambda update-function-code \
            --function-name ecomadison-vision-proxy \
            --zip-file fileb://function.zip
